<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Connexion | Para'Noel</title>
    <meta name="theme-color" content="#0e3b2e">
    <link rel="icon" type="image/svg+xml" href="/images/icone-paranoel.svg">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body>
    <main class="auth-container">
        <div class="neige" aria-hidden="true"></div>
        <form id="formulaire-connexion" class="auth-card" novalidate>
            <a class="auth-logo" href="/" aria-label="Retour au site Para'Noel">
                <img src="/images/logo-paranoel.svg" alt="Para'Noel" width="220" height="61">
            </a>
            <h1>Connexion</h1>
            <p class="auth-intro">Connecte-toi pour participer aux jeux concours.</p>

            <div class="field">
                <label for="email">E-mail</label>
                <input type="email" name="email" id="email" autocomplete="email" required>
            </div>

            <div class="field">
                <label for="password">Mot de passe</label>
                <input type="password" name="password" id="password" autocomplete="current-password" required>
            </div>

            <div class="options-row">
                <label><input type="checkbox" id="remember" name="remember"> Se souvenir de moi</label>
            </div>

            <div id="resultat" class="alerte" aria-live="polite"></div>

            <!-- Affiché seulement si l'e-mail n'est pas encore vérifié -->
            <button type="button" id="btn-renvoyer" class="link-btn" hidden>Renvoyer le lien de vérification</button>

            <button type="submit" id="btn-connexion">Se connecter</button>


            <div class="separator"><span>ou continuer avec</span></div>

            <div class="social-buttons">
                <a class="social-btn" href="/auth/google">
                <svg class="social-icon" viewBox="0 0 48 48" aria-hidden="true">
                    <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/>
                    <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/>
                    <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/>
                    <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/>
                </svg>
                <span>Continuer avec Google</span>
                </a>

            </div>
            <p class="switch">Pas encore de compte ? <a href="/register">S'inscrire</a></p>
            <p class="switch"><a href="/">← Retour au site</a></p>
        </form>
    </main>

    <script src="/js/alerte.js"></script>
    <script src="/js/connexion.js"></script>
</body>
</html>
