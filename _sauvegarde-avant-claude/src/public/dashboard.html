<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mon espace | Para'Noel</title>
    <meta name="theme-color" content="#0e3b2e">
    <link rel="icon" type="image/svg+xml" href="/images/icone-paranoel.svg">
    <meta name="robots" content="noindex">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,600;9..144,800&amp;family=Nunito:wght@400;600;700;800&amp;display=swap">
    <link rel="stylesheet" href="/css/style.css">
</head>
<body class="espace">
    <!-- Page protégée : le serveur ne l'envoie qu'aux utilisateurs connectés (requireAuth) -->
    <header class="topbar">
        <a class="topbar__logo" href="/" aria-label="Retour au site Para'Noel">
            <img src="/images/logo-paranoel-blanc.svg" alt="Para'Noel" width="160" height="44">
        </a>
        <h1>Mon espace</h1>
        <button type="button" id="logout-btn">Se déconnecter</button>
    </header>

    <main class="container">
        <!-- Affiché par dashboard.js seulement si /api/me renvoie le rôle « admin » ou « super_admin » -->
        <section class="card" id="lien-admin" aria-labelledby="titre-admin" hidden>
            <h2 id="titre-admin">Administration</h2>
            <p><a href="/admin">Ouvrir le tableau de bord d'administration</a></p>
        </section>

        <section class="card" aria-labelledby="titre-bienvenue">
            <h2 id="titre-bienvenue">Bienvenue</h2>
            <p id="welcome">Chargement de tes informations…</p>
            <dl>
                <dt>Identifiant</dt>
                <dd id="user-id">…</dd>
                <dt>E-mail</dt>
                <dd id="user-email">…</dd>
            </dl>
        </section>

        <section class="card" aria-labelledby="titre-participations">
            <h2 id="titre-participations">Mes participations</h2>
            <!-- Rempli par dashboard.js depuis GET /api/me/participations -->
            <p id="mes-participations">Tu ne participes encore à aucun jeu. <a href="/participer">Participer</a></p>
        </section>

        <p><a href="/">← Retour au site</a></p>
    </main>

    <script src="/js/dashboard.js" defer></script>
</body>
</html>
